[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalscope"
version = "0.1.0"
description = "SignalScope: Arduino oscilloscope and DSP laboratory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyserial>=3.5",
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
signalscope = "signalscope.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
